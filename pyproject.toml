[project]
name = "nucleus-platform"
version = "0.1.0"
description = "Governed data product catalog and agent capability registry"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.25,<5", "referencing>=0.36,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
nucleus = "nucleus.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nucleus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
